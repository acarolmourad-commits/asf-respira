<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASF Respira — Treinador de Respiração</title>
<meta name="description" content="Treinador interativo de respiração 4-4-4 e apneia para surfistas. Satélite do app ASF.">
<style>:root{--p:#00a8cc;--pd:#0e2439;--g:#f4d03f}*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#f6fbfd;color:var(--pd)}nav{background:var(--pd);padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px}nav a{color:#fff;text-decoration:none;font-size:11px;font-weight:600;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,.08)}nav a.hub{background:var(--g);color:var(--pd)}header{padding:36px 20px;text-align:center;background:linear-gradient(135deg,#00a8cc22,#9b59b618)}h1{font-size:26px}main{max-width:520px;margin:22px auto;padding:0 16px;text-align:center}.circle{width:170px;height:170px;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#00a8cc33,#00a8cc11);border:3px solid var(--p);transition:transform 4s ease-in-out;font-size:44px}.phase{font-size:20px;font-weight:700;margin-top:8px}.count{font-size:40px;font-weight:800;color:var(--p)}.btn{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border:none;border-radius:12px;padding:13px 26px;font-size:15px;font-weight:600;cursor:pointer;margin:6px}.modes button{background:#fff;border:1.5px solid var(--p);color:var(--p);border-radius:20px;padding:7px 14px;font-weight:600;cursor:pointer;margin:3px}.modes button.on{background:var(--p);color:#fff}footer{text-align:center;padding:26px;font-size:12px;color:#678}</style>
</head>
<body>
<nav>
<a class="hub" href="https://acarolmourad-commits.github.io/asf-app/">🏄‍♀️ ASF App</a>
<a href="https://acarolmourad-commits.github.io/asf-previsao/">🌊</a>
<a href="https://acarolmourad-commits.github.io/asf-praias/">🏖️</a>
<a href="https://acarolmourad-commits.github.io/asf-treino/">💪</a>
<a href="https://acarolmourad-commits.github.io/asf-eventos/">📅</a>
<a href="https://acarolmourad-commits.github.io/asf-glossario/">📖</a>
<a href="https://acarolmourad-commits.github.io/asf-comunidade/">💜</a>
<a href="https://acarolmourad-commits.github.io/asf-seguranca/">🛟</a>
<a href="https://acarolmourad-commits.github.io/asf-quiz/">🧠</a>
<a href="https://acarolmourad-commits.github.io/asf-equipamento/">🏄</a>
<a href="https://acarolmourad-commits.github.io/asf-nutricao/">🥑</a>
<a href="https://acarolmourad-commits.github.io/asf-viagens/">✈️</a>
<a href="https://acarolmourad-commits.github.io/asf-historia/">📜</a>
<a href="https://acarolmourad-commits.github.io/asf-diario/">📓</a>
<a href="https://acarolmourad-commits.github.io/asf-volume/">📐</a>
</nav>
<header><h1>🫁 ASF Respira</h1><p>Treine a respiração para ficar calma embaixo d'água</p></header>
<main>
<div class="modes" id="modes">
<button class="on" data-m="calma">😌 Calma 4-4-4</button>
<button data-m="energia">⚡ Energia 4-2-6</button>
<button data-m="apneia">🌊 Apneia 5-10-1</button>
</div>
<div class="circle" id="circle">🫁</div>
<p class="phase" id="phase">Pronta?</p>
<p class="count" id="count">—</p>
<p style="font-size:13px;color:#567" id="rounds">Ciclos: 0</p>
<button class="btn" id="go" onclick="toggle()">▶ Começar</button>
<p style="font-size:12px;color:#789;margin-top:14px">Combine com as dicas de <a href="https://acarolmourad-commits.github.io/asf-seguranca/">Segurança</a> e os treinos do <a href="https://acarolmourad-commits.github.io/asf-treino/">ASF Treino</a>.</p>
</main>
<footer>Parte da constelação ASF • <a href="https://acarolmourad-commits.github.io/asf-app/">Voltar ao app principal</a></footer>
<script>
const MODES={calma:[['Inspire 🌬️',4],['Segure ✋',4],['Expire 😮‍💨',4]],energia:[['Inspire 🌬️',4],['Segure ✋',2],['Expire 😮‍💨',6]],apneia:[['Inspire fundo 🌬️',5],['Segure tudo ✋',10],['Solte devagar 😮‍💨',6]]};
let mode='calma',run=false,timer=null,cycles=0;
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;stop()});
function toggle(){run?stop():start()}
function start(){run=true;document.getElementById('go').textContent='⏸ Parar';step(0)}
function stop(){run=false;clearTimeout(timer);document.getElementById('go').textContent='▶ Começar';document.getElementById('phase').textContent='Pronta?';document.getElementById('count').textContent='—';document.getElementById('circle').style.transform='scale(1)'}
function step(i){
 if(!run)return;
 const seq=MODES[mode],[name,sec]=seq[i];
 document.getElementById('phase').textContent=name;
 document.getElementById('circle').style.transform=name.includes('Inspire')?'scale(1.35)':'scale(1)';
 let s=sec;document.getElementById('count').textContent=s;
 const tick=()=>{if(!run)return;s--;if(s>0){document.getElementById('count').textContent=s;timer=setTimeout(tick,1000)}else{if(i===seq.length-1){cycles++;document.getElementById('rounds').textContent='Ciclos: '+cycles}step((i+1)%seq.length)}};
 timer=setTimeout(tick,1000);
}
</script>
</body>
</html>
